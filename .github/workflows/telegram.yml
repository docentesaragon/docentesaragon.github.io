name: Publicar en Telegram (a mano)

# Para lanzarlo: Actions → «Publicar en Telegram (a mano)» → Run workflow.
#   simulacro: no publica nada; enseña el texto en el resumen y deja las imágenes en «Artifacts» → tarjetas (descargar y abrir).
#   publicar:  publica las adjudicaciones que falten (o solo el acto que escribas, aunque sea antiguo).
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "simulacro (solo ver) o publicar"
        type: choice
        options: [simulacro, publicar]
        default: simulacro
      acto:
        description: "Opcional: un acto concreto, p. ej. SEC-2026-36 (vacío = las adjudicaciones recientes que falten)"
        required: false
        default: ""
      dias:
        description: "Antigüedad máxima en días cuando no escribes acto"
        default: "4"

concurrency:
  group: robot-semanal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar el dibujo de la tarjeta
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
          MODO: ${{ github.event.inputs.modo }}
          ACTO: ${{ github.event.inputs.acto }}
          DIAS: ${{ github.event.inputs.dias }}
        run: |
          ARGS="--dias ${DIAS:-4}"
          if [ -n "$ACTO" ]; then ARGS="$ARGS --acto $ACTO"; fi
          if [ "$MODO" != "publicar" ]; then ARGS="$ARGS --simulacro"; fi
          python pipeline/telegram_canal.py $ARGS
      - name: Guardar las imágenes del simulacro
        if: always() && github.event.inputs.modo != 'publicar'
        uses: actions/upload-artifact@v4
        with:
          name: tarjetas
          path: tarjetas_telegram/
          if-no-files-found: ignore
          retention-days: 7
