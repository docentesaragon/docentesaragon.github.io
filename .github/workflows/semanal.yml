name: Descarga semanal de Educaragón

on:
  schedule:
    # 1) REINTENTOS DE LA TARDE: de lunes a viernes, cada hora entre las 12 y las 16 UTC (a los 5 minutos, porque a en punto GitHub va saturado).
    #    pipeline/puerta_horaria.py deja pasar solo las de 14:00 a 17:59 hora de Aragón (invierno = 13-16 UTC, verano = 12-15 UTC).
    #    Cada pasada mira si Educaragón ha publicado algo que aún no está en la web: si sí, lo sube y avisa; si no, no toca nada y termina en un minuto.
    - cron: "5 12-16 * * 1-5"
    # 2) LA DE SIEMPRE: lunes a viernes a las 17:00 UTC (18:00/19:00 en Aragón). Hace la descarga completa, haya o no novedades.
    - cron: "0 17 * * 1-5"
    # 3) Los domingos, un repaso más largo (30 días) por si Educaragón publicó algún fichero con retraso.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      dias:
        description: "Cuántos días hacia atrás buscar (a mano: 21 por defecto; cada día laborable se usan 7 y los domingos 30)"
        default: "21"

# Nunca dos ejecuciones a la vez (por ejemplo, si una pasada se retrasa o la lanzas a mano mientras corre otra): se ponen en cola.
concurrency:
  group: robot-semanal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Solo los reintentos horarios de la tarde llevan «solo si hay novedades» y pasan por la puerta horaria.
      ES_REINTENTO: ${{ github.event.schedule == '5 12-16 * * 1-5' && 'si' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar la hora (solo los reintentos de la tarde)
        id: puerta
        run: |
          if [ "$ES_REINTENTO" = "si" ]; then
            python pipeline/puerta_horaria.py --reintento
          else
            python pipeline/puerta_horaria.py
          fi
      - name: Instalar herramientas
        if: steps.puerta.outputs.seguir == 'si'
        timeout-minutes: 12
        run: |
          # pdftotext (poppler). Si los servidores de Ubuntu no responden (fallo de GitHub), plan B: conda-forge (igual que DocentCV).
          pip install pypdf cryptography
          if command -v pdftotext >/dev/null; then echo "Ya estaba instalado"; exit 0; fi
          if timeout 150 sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
             && timeout 150 sudo apt-get install -y -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 poppler-utils; then
            echo "Instalado desde Ubuntu"; exit 0
          fi
          echo "::warning::Los servidores de Ubuntu no responden; instalo pdftotext desde conda-forge (plan B)"
          cd "$HOME"
          curl -fsSL --retry 5 --retry-delay 5 https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj bin/micromamba
          ./bin/micromamba create -y -q -r "$HOME/mamba" -p "$HOME/herr" -c conda-forge poppler
          echo "$HOME/herr/bin" >> "$GITHUB_PATH"
          "$HOME/herr/bin/pdftotext" -v 2>&1 | head -1
      - name: Bajar, leer, subir a Supabase y avisar a la app
        if: steps.puerta.outputs.seguir == 'si'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DIAS: ${{ github.event.inputs.dias || (github.event.schedule == '0 18 * * 0' && '30' || '7') }}
        run: |
          EXTRA=""
          if [ "$ES_REINTENTO" = "si" ]; then EXTRA="--solo-novedades"; fi
          python pipeline/semanal.py --dias "$DIAS" --subir $EXTRA
      - name: ¿Hay algo nuevo para Telegram?
        id: tg
        if: steps.puerta.outputs.seguir == 'si'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python pipeline/telegram_canal.py --comprobar
      - name: Preparar el dibujo de la tarjeta (solo si hay algo que publicar)
        if: steps.tg.outputs.pendientes == 'si'
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Publicar en el canal de Telegram
        # Publica como imagen (igual que la web) las adjudicaciones nuevas de los últimos 4 días. Si falla, el robot no se pone en rojo.
        if: steps.tg.outputs.pendientes == 'si'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
        run: python pipeline/telegram_canal.py
